name: Generate Sitemap

on:
  push:
      branches:
            - main  # or your default branch
              workflow_dispatch:

              jobs:
                build:
                    runs-on: ubuntu-latest
                        steps:
                              - uses: actions/checkout@v3

                                    - name: Setup Node.js
                                            uses: actions/setup-node@v3
                                                    with:
                                                              node-version: 18

                                                                    - name: Install Sitemap Generator
                                                                            run: npm install -g sitemap-generator-cli

                                                                                  - name: Generate sitemap.xml
                                                                                          run: |
                                                                                                    mkdir -p ./public
                                                                                                              sitemap-generator https://projectbuilders.pages.dev --output ./public/sitemap.xml

                                                                                                                    - name: Commit sitemap.xml
                                                                                                                            run: |
                                                                                                                                      git config user.name "github-actions"
                                                                                                                                                git config user.email "github-actions@users.noreply.github.com"
                                                                                                                                                          git add public/sitemap.xml
                                                                                                                                                                    git commit -m "Generate sitemap.xml"
                                                                                                                                                                              git push